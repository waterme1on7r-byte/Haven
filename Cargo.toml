[package]
name = "haven"
version = "0.1.2"
edition = "2021"

[dependencies]
eframe    = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
symphonia = { version = "0.5", features = ["all"] }   # FLAC, ALAC, WAV, AIFF, MP3, AAC, OGG decoding
cpal      = "0.15"                                     # WASAPI (Windows) / CoreAudio (macOS)
rtrb      = "0.3"                                      # lock-free ring buffer decoder -> audio callback
lofty     = "0.21"                                     # tags + stream properties
rfd       = "0.15"                                     # native open dialogs
anyhow    = "1"

[build-dependencies]
winres = "0.1"

[package.metadata.packager]
product-name = "Haven"
identifier = "com.haven.player"
description = "Minimal lossless desktop audio player"
before-packaging-command = "cargo build --release"
out-dir = "dist"
icons = ["assets/haven.ico", "assets/haven.icns"]

[package.metadata.packager.nsis]
installer-icon = "assets/haven.ico"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
