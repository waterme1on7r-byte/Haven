name: Build Haven

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            format: nsis
            label: Windows installer
            artifact: Haven-Windows
          - runner: macos-latest
            format: app
            label: macOS disk image
            artifact: Haven-macOS
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The in-app updater compares the release tag with this version.
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != Cargo version v$v"; exit 1; }
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install packager
        run: cargo install cargo-packager --locked
      - name: Build package
        run: cargo packager --release --formats ${{ matrix.format }}
      - name: Sign app and build DMG (macOS)
        if: matrix.runner == 'macos-latest'
        run: |
          # Sign AFTER stripping/bundling so the signature is valid, then
          # verify it. The DMG is built from the already-signed app.
          codesign --force --deep --sign - dist/Haven.app
          codesign --verify --deep --strict --verbose=2 dist/Haven.app
          file dist/Haven.app/Contents/MacOS/*
          hdiutil create -volname Haven -srcfolder dist/Haven.app -ov -format UDZO dist/Haven.dmg
          rm -rf dist/Haven.app
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Attach installers to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows and macOS packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
